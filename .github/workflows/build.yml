name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: the build reads the repo and writes nothing back.
permissions:
  contents: read

# Supersede an in-flight run when a PR is pushed to again; never cancel a run on main,
# where each commit's result is the record of whether that commit was green.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # From the root, never `-pl brat-core`: the aggregator is where a parent-pom
      # misconfiguration shows up, and `-Pchecks` is the full gate (spotless check,
      # checkstyle, doclint, tests, jacoco floor, spotbugs) — every one of them binds
      # at or before `test`, so `test` is enough.
      - name: Build
        run: mvn -B --no-transfer-progress clean test -Pchecks

      # Only on failure: a CI-only failure is otherwise very hard to diagnose from the log
      # alone, particularly a jacoco floor breach or a spotbugs finding.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/target/surefire-reports/
            **/target/site/jacoco/
            **/target/spotbugsXml.xml
          retention-days: 7
          if-no-files-found: ignore

  # BRAT targets Java 21, so the tests also run on a Java 21 runtime: compiled by JDK 25 with
  # `--release 21` (which already rejects any API newer than 21), then forked onto 21, which is
  # what catches a difference in runtime behaviour. The gates run once, in `build`; this job only
  # answers "does it work on 21".
  test-on-21:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # Both JDKs: the last one listed becomes JAVA_HOME and runs Maven; each also gets
      # JAVA_HOME_<version>_X64, which is how Surefire is pointed at 21.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25
          cache: maven

      - name: Test on Java 21
        run: mvn -B --no-transfer-progress clean test -Djvm="$JAVA_HOME_21_X64/bin/java"
