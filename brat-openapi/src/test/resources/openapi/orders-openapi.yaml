# The spec the suite-author walkthrough of `brat import` imports.
openapi: 3.0.3
info:
  title: Orders API
servers:
  - url: http://localhost:8080
    description: local
  - url: https://orders.staging.example.com
    description: The staging server, reset nightly
security:
  - clientCredentials: [orders.read, orders.write]
components:
  securitySchemes:
    clientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://login.example.com/oauth/token
          scopes:
            orders.read: read orders
            orders.write: create orders
    bulkKey:
      type: apiKey
      in: header
      name: X-Bulk-Key
  parameters:
    orderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        example: "4711"
  schemas:
    Order:
      type: object
      required: [item, quantity, customerRef]
      properties:
        item:
          type: string
          example: book
        quantity:
          type: integer
          example: 2
        currency:
          type: string
          example: EUR
        customerRef:
          type: string
        note:
          type: string
paths:
  /health:
    get:
      summary: health check
      security: []
      responses:
        "200":
          description: up
  /orders:
    post:
      tags: [orders]
      summary: create an order
      requestBody:
        content:
          application/json:
            example:
              item: book
              quantity: 2
              currency: EUR
      responses:
        "201":
          description: created
        "400":
          description: invalid
    get:
      tags: [orders]
      operationId: listOrders
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [OPEN, SHIPPED, CANCELLED]
            example: OPEN
        - name: limit
          in: query
          required: false
      responses:
        "200":
          description: the orders
  /orders/{orderId}:
    parameters:
      - $ref: "#/components/parameters/orderId"
    get:
      tags: [orders]
      summary: read an order
      responses:
        "200":
          description: the order
    put:
      tags: [orders]
      summary: update an order
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Order"
      responses:
        "200":
          description: updated
  /orders/{orderId}/shipments:
    get:
      tags: [orders]
      summary: list an order's shipments
      parameters:
        - $ref: "#/components/parameters/orderId"
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [IN_TRANSIT, DELIVERED]
      responses:
        "200":
          description: the shipments
  /orders/{orderId}/items/{itemId}:
    delete:
      tags: [orders]
      summary: remove an item
      parameters:
        - $ref: "#/components/parameters/orderId"
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: removed
  /orders/import:
    servers:
      - url: https://bulk.example.com
    post:
      tags: [bulk]
      summary: import orders
      security:
        - bulkKey: []
      requestBody:
        content:
          application/json:
            example: {"source":"legacy","orders":[{"item":"book","quantity":2},{"item":"pen","quantity":10},{"item":"lamp","quantity":1}],"dryRun":false,"notify":["ops@example.com"]}
      responses:
        "202":
          description: accepted
  /orders/import/{jobId}:
    servers:
      - url: https://bulk.example.com
    get:
      tags: [bulk]
      summary: read an import job
      security:
        - bulkKey: []
      parameters:
        - name: jobId
          in: path
          required: true
          example: job-1
      responses:
        "200":
          description: the job
