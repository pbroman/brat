# Split constants, an enum fallback, a commented-out constant, and bodies built from schemas.
openapi: 3.1.0
info:
  title: Constants and bodies
servers:
  - url: http://localhost:8080
    description: local
paths:
  /search:
    get:
      summary: search
      parameters:
        - name: type
          in: query
          required: true
          schema: { type: array, items: { type: string, enum: [album, artist] } }
  /me/top/{type}:
    get:
      summary: top items
      parameters:
        - { name: type, in: path, schema: { type: string, enum: [artists, tracks] } }
  /orders/{orderId}/items/{itemId}:
    put:
      summary: update an item
      parameters:
        - { name: orderId, in: path, example: "4711" }
        - { name: itemId, in: path }
      requestBody:
        content:
          application/json:
            schema:
              required: [sku, quantity, customer]
              properties:
                sku: { type: string, example: B-1 }
                quantity: { type: integer }
                customer: { required: [name], properties: { name: { type: string } } }
      responses:
        "200": { description: updated }
  /board:
    put:
      summary: mark
      requestBody:
        content:
          application/json:
            schema: { type: string, example: . }
