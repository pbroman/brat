# Imported from orders-openapi.yaml (Orders API). A starting point: edit freely.
name: Orders API

constants:
  status: OPEN                             # example from the spec
  orderId: "4711"                          # example from the spec
  status_shipments: IN_TRANSIT             # the first of IN_TRANSIT, DELIVERED; the "status" of "list an order's shipments", not listOrders'
  # itemId:                                # no example in the spec: fill in, or -p constants.itemId=…
  jobId: job-1                             # example from the spec

auth:                                      # the spec's default security: clientCredentials
  type: bearer
  args:
    token: "${vars.accessToken}"           # set by "get a token" below

requests:
  - name: get a token
    phase: setup                           # runs first; if it fails, nothing else runs
    skipCondition:                         # skipped when a token is handed over (vars.accessToken)
      a: "${vars.accessToken}"
      func: isNotBlank
    auth:
      type: none                           # the token request must not send the token it fetches
    requestDefinition:
      url: "${env.tokenUrl}"
      method: POST
      body:
        form:
          grant_type: client_credentials
          client_id: "${env.clientId}"
          client_secret: "${secrets.clientSecret}"  # BRAT_SECRET_CLIENT_SECRET, or a secrets file
          scope: orders.read orders.write
    responseActions:
      assertions:
        - a: "${response.statusCode}"
          func: isEqualTo
          b: 200
      setVars:
        accessToken: "${response.json.$.access_token}"

  - name: health check
    auth:                                  # security: [] in the spec
      type: none
    requestDefinition:
      url: "${env.baseUrl}/health"
    responseActions:
      assertions:
        - a: "${response.statusCode}"
          func: isEqualTo
          b: 200

subSuites:
  - name: orders
    requests:
      - name: create an order
        requestDefinition:
          url: "${env.baseUrl}/orders"
          method: POST
          headers:
            Content-Type: application/json
          body:
            raw: |
              {
                "item": "book",
                "quantity": 2,
                "currency": "EUR"
              }
        responseActions:
          assertions:
            - a: "${response.statusCode}"
              func: isEqualTo
              b: 201

      - name: listOrders
        requestDefinition:
          url: "${env.baseUrl}/orders?status=${constants.status}"  # optional: limit
        responseActions:
          assertions:
            - a: "${response.statusCode}"
              func: isEqualTo
              b: 200

      - name: read an order
        requestDefinition:
          url: "${env.baseUrl}/orders/${constants.orderId}"
        responseActions:
          assertions:
            - a: "${response.statusCode}"
              func: isEqualTo
              b: 200

      - name: update an order
        requestDefinition:
          url: "${env.baseUrl}/orders/${constants.orderId}"
          method: PUT
          headers:
            Content-Type: application/json
          body:                            # built from the schema's examples; fill in: customerRef
            raw: |
              {
                "item": "book",
                "quantity": 2,
                "currency": "EUR",
                "customerRef": ""
              }
        responseActions:
          assertions:
            - a: "${response.statusCode}"
              func: isEqualTo
              b: 200

      - name: "list an order's shipments"
        requestDefinition:
          url: "${env.baseUrl}/orders/${constants.orderId}/shipments?status=${constants.status_shipments}"
        responseActions:
          assertions:
            - a: "${response.statusCode}"
              func: isEqualTo
              b: 200

      - name: remove an item
        requestDefinition:
          url: "${env.baseUrl}/orders/${constants.orderId}/items/${constants.itemId}"
          method: DELETE
        responseActions:
          assertions:
            - a: "${response.statusCode}"
              func: isEqualTo
              b: 204

  - name: bulk
    auth:                                  # the spec's security for every request here: bulkKey
      type: apikey
      args:
        key: "${secrets.apiKey}"           # BRAT_SECRET_API_KEY, or a secrets file
        header: X-Bulk-Key
    requests:
      - name: import orders
        requestDefinition:
          url: "${env.bulkBaseUrl}/orders/import"
          method: POST
          headers:
            Content-Type: application/json
          body:
            file: bodies/import-orders.json  # 21 lines: longer than --body-file-lines (10)
        responseActions:
          assertions:
            - a: "${response.statusCode}"
              func: isEqualTo
              b: 202

      - name: read an import job
        requestDefinition:
          url: "${env.bulkBaseUrl}/orders/import/${constants.jobId}"
        responseActions:
          assertions:
            - a: "${response.statusCode}"
              func: isEqualTo
              b: 200
