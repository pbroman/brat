# A secret making every hop: out of the provider, through interpolation, into a header, onto the wire
# - and masked on the way back out into the report. Only a full assembly covers the whole path.
#
# The assertion compares the echoed body against the secret rather than against a literal, so the
# suite file itself holds no credential.
name: a secret header
description: sends a secret in a header and checks the server received it

requests:
  - name: send the token
    requestDefinition:
      url: "${env.baseUrl}/echo"
      method: GET
      headers:
        X-Api-Token: "${secrets.apiToken}"
    responseActions:
      assertions:
        - a: "${response.statusCode}"
          func: isEqualTo
          b: "200"
          message: the echo endpoint must have answered
        - a: "${response.body}"
          func: contains
          b: "${secrets.apiToken}"
          message: the token must have reached the wire
