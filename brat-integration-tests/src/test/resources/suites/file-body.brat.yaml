# A body read from a file. Both halves are asserted here: the path is built from a token, and the
# file's *content* holds one too - which is the case the finding from 8a step 7 was about, and is
# what a large templated body is for.
name: a body from a file
description: creates a user from a body file named by a token

requests:
  - name: create a user from a file
    requestDefinition:
      url: "${env.baseUrl}/create"
      method: POST
      headers:
        Content-Type: application/json
      body:
        file: "classpath:bodies/${env.bodyFile}"
    responseActions:
      assertions:
        - a: "${response.statusCode}"
          func: isEqualTo
          b: "201"
          message: the user must have been created from the file's content
        - a: "${response.json.$.username}"
          func: isEqualTo
          b: from-a-file
          message: the username must be the one the file carries
        - a: "${response.json.$.address.city}"
          func: isEqualTo
          b: Testville
          message: the whole file must have been sent, nested objects included
        - a: "${response.json.$.address.street}"
          func: isEqualTo
          b: Sesame Street
          message: a token inside the body file must be resolved before the file is sent
