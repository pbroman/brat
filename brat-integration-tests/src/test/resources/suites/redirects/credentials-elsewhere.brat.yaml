# A redirect to another origin is refused while the request carries credentials: following it would
# hand the token to whatever host the server names. localhost and 127.0.0.1 are two origins.
name: credentials elsewhere
followRedirects: "true"
auth:
  type: bearer
  args:
    token: reader-token
requests:
  - name: sent elsewhere
    requestDefinition:
      url: "${env.baseUrl}/redirect?to=${env.otherBaseUrl}/secure/whoami"
    responseActions:
      assertions:
        - a: "${response.statusCode}"
          func: isEqualTo
          b: 302   # refused, so the 3xx is what came back
