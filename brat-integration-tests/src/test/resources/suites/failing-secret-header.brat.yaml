# A request that fails while carrying a secret: the console then prints the request as it was sent,
# header included - and the header must come out masked.
name: a failing secret header
description: sends a secret in a header and expects a status the server does not answer with

requests:
  - name: send the token
    requestDefinition:
      url: "${env.baseUrl}/echo"
      method: GET
      headers:
        X-Api-Token: "${secrets.apiToken}"
    responseActions:
      assertions:
        - a: "${response.statusCode}"
          func: isEqualTo
          b: "201"   # the echo endpoint answers 200, so this fails on purpose
          message: the status must be Created
